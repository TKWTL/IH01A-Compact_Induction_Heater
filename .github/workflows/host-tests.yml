# The firmware host regression suite is retained for explicit runs only.
# Deliberately no push/PR triggers: IH01A is an archival research project.
# Run from GitHub Actions -> Firmware host regression tests -> Run workflow.
name: Firmware host regression tests
on:
  workflow_dispatch:
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C99 host tests
        run: bash Firmware/Tests/host/run.sh
